<!doctype html>
<!--
  Social preview card (LinkedIn/X link previews and the GitHub repository card).
  Rendered to PNG by scripts/media/previews.mjs; edit this file, then run `npm run media:previews`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Air Defense Simulator preview card</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
      }
      :root {
        --accent: #22d3ee;
        --ink-100: #e4eaf5;
        --ink-200: #bcc8dd;
        --ink-300: #8fa0bf;
        --ink-600: #22304f;
        --ink-700: #18243f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      body {
        position: relative;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        color: var(--ink-100);
        background:
          radial-gradient(55% 80% at 78% 45%, rgba(14, 116, 144, 0.38), transparent 62%),
          radial-gradient(45% 60% at 8% 100%, rgba(34, 211, 238, 0.08), transparent 70%),
          linear-gradient(160deg, #060b16 0%, #0a1428 60%, #08111f 100%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(34, 211, 238, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(34, 211, 238, 0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(75% 85% at 72% 45%, black, transparent);
      }
      .wrap {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        align-items: center;
        gap: 24px;
        padding: 44px 64px 96px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--accent);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .eyebrow svg {
        width: 34px;
        height: 34px;
      }
      h1 {
        margin-top: 20px;
        font-size: 66px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .tagline {
        margin-top: 18px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .desc {
        margin-top: 12px;
        max-width: 31em;
        font-size: 19px;
        line-height: 1.5;
        color: var(--ink-300);
      }
      .scope {
        justify-self: center;
        width: 100%;
        max-width: 420px;
      }
      .scope svg {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 40px rgba(34, 211, 238, 0.18));
      }
      .pipeline {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 34px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      .stage {
        padding: 7px 11px;
        border: 1px solid rgba(34, 211, 238, 0.45);
        border-radius: 8px;
        background: rgba(34, 211, 238, 0.08);
        color: var(--accent);
      }
      .sep {
        color: #33456b;
      }
      .credit {
        margin-left: auto;
        font-family: 'Inter', sans-serif;
        letter-spacing: 0;
        font-size: 15px;
        color: var(--ink-200);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="wrap">
      <div>
        <div class="eyebrow">
          <svg viewBox="0 0 32 32" fill="none">
            <circle
              cx="16"
              cy="16"
              r="13"
              stroke="#22d3ee"
              stroke-width="2"
              stroke-opacity="0.55"
            />
            <circle
              cx="16"
              cy="16"
              r="7.5"
              stroke="#22d3ee"
              stroke-width="1.5"
              stroke-opacity="0.35"
            />
            <path d="M16 16V3a13 13 0 0 1 11.26 6.5Z" fill="#22d3ee" fill-opacity="0.3" />
            <path d="M16 16 27.26 9.5" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
            <circle cx="21.5" cy="20.5" r="2" fill="#22d3ee" />
          </svg>
          Open source · Educational
        </div>
        <h1>Air Defense<br />Simulator</h1>
        <p class="tagline">See how an air-defense system thinks.</p>
        <p class="desc">
          Drag a drone, missile or jet onto the map and watch the full defense loop, with real
          physics explained in plain language.
        </p>
      </div>
      <div class="scope">
        <svg viewBox="0 0 200 200" id="scope"></svg>
      </div>
    </div>
    <div class="pipeline">
      <span class="stage">DETECT</span><span class="sep">›</span> <span class="stage">TRACK</span
      ><span class="sep">›</span> <span class="stage">IDENTIFY</span><span class="sep">›</span>
      <span class="stage">EVALUATE</span><span class="sep">›</span> <span class="stage">ASSIGN</span
      ><span class="sep">›</span> <span class="stage">ENGAGE</span><span class="sep">›</span>
      <span class="stage">ASSESS</span>
      <span class="credit">Built with Claude</span>
    </div>

    <script>
      // Draws the radar scope: rings, ticks, a sweep with a fading trail, and three tracks.
      const svg = document.getElementById('scope');
      const NS = 'http://www.w3.org/2000/svg';
      const add = (tag, attrs) => {
        const el = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
        svg.appendChild(el);
        return el;
      };
      const polar = (deg, r) => {
        const a = (deg * Math.PI) / 180;
        return [100 + r * Math.sin(a), 100 - r * Math.cos(a)];
      };

      const defs = add('defs', {});
      defs.innerHTML =
        '<radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0b2a33"/><stop offset="1" stop-color="#06121a"/></radialGradient>';
      add('circle', {
        cx: 100,
        cy: 100,
        r: 96,
        fill: 'url(#bg)',
        stroke: '#22d3ee',
        'stroke-opacity': 0.45,
      });
      for (const r of [24, 48, 72]) {
        add('circle', {
          cx: 100,
          cy: 100,
          r,
          fill: 'none',
          stroke: '#22d3ee',
          'stroke-opacity': 0.16,
        });
      }
      add('path', { d: 'M100 4V196M4 100H196', stroke: '#22d3ee', 'stroke-opacity': 0.12 });
      for (let deg = 0; deg < 360; deg += 10) {
        const major = deg % 30 === 0;
        const [x1, y1] = polar(deg, major ? 87 : 91);
        const [x2, y2] = polar(deg, 96);
        add('line', { x1, y1, x2, y2, stroke: '#22d3ee', 'stroke-opacity': major ? 0.55 : 0.25 });
      }

      // Sweep: leading edge at 52 degrees, trail fading counter-clockwise behind it.
      const LEAD = 52;
      for (let i = 0; i < 12; i++) {
        const a0 = LEAD - (i + 1) * 4;
        const a1 = LEAD - i * 4;
        const [x0, y0] = polar(a0, 96);
        const [x1, y1] = polar(a1, 96);
        add('path', {
          d: `M100 100 L${x0} ${y0} A96 96 0 0 1 ${x1} ${y1} Z`,
          fill: '#22d3ee',
          'fill-opacity': (0.3 * (12 - i)) / 12,
        });
      }
      const [lx, ly] = polar(LEAD, 96);
      add('line', { x1: 100, y1: 100, x2: lx, y2: ly, stroke: '#a5f3fc', 'stroke-width': 1.4 });

      // Hostile track (diamond) with history dots, and the interceptor curving toward it.
      [
        [18, 84],
        [22, 79],
        [26, 74],
        [30, 69],
      ].forEach(([deg, r], i) => {
        const [x, y] = polar(deg, r);
        add('circle', { cx: x, cy: y, r: 1.3, fill: '#f87171', 'fill-opacity': 0.25 + i * 0.15 });
      });
      const [hx, hy] = polar(36, 63);
      add('path', {
        d: `M${hx} ${hy - 5} L${hx + 5} ${hy} L${hx} ${hy + 5} L${hx - 5} ${hy} Z`,
        fill: '#f87171',
      });
      add('path', {
        d: `M100 100 Q${hx + 10} ${hy + 30} ${hx + 2} ${hy + 6}`,
        fill: 'none',
        stroke: '#22d3ee',
        'stroke-width': 1.6,
        'stroke-linecap': 'round',
      });

      // Friendly aircraft (circle) and a civil airliner (square) that must not be engaged.
      const [fx, fy] = polar(248, 66);
      add('circle', {
        cx: fx,
        cy: fy,
        r: 4.5,
        fill: 'none',
        stroke: '#60a5fa',
        'stroke-width': 1.8,
      });
      const [cx, cy] = polar(318, 80);
      add('rect', {
        x: cx - 4,
        y: cy - 4,
        width: 8,
        height: 8,
        fill: 'none',
        stroke: '#4ade80',
        'stroke-width': 1.8,
      });

      // The battery at the centre.
      add('path', { d: 'M95.5 103 L100 95 L104.5 103 Z', fill: '#22d3ee' });
    </script>
  </body>
</html>
